<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>青卷 · 私人书房</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#dfe8e2;--paper:#f5f8f3;--ink:#1b2924;--mute:#7b8c84;--acc:#2d6a5b;--line:#cbd8d0;--sh:0 30px 60px -28px rgba(20,50,40,.45)}
[data-t=night]{--bg:#0b110f;--paper:#131c19;--ink:#bccac3;--mute:#5f7168;--acc:#6dbfa8;--line:#212e29;--sh:0 30px 60px -28px #000}
[data-t=xuan]{--bg:#d9ccb0;--paper:#ece2c8;--ink:#33291a;--mute:#8a7a58;--acc:#35507a;--line:#cfc19f}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Noto Serif SC','Songti SC',Georgia,serif;transition:background .4s,color .4s;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.view{display:none;min-height:100%}.view.on{display:block}
/* login */
#login.on{display:grid;place-items:center}
.lbox{width:min(360px,88vw);display:grid;gap:14px;text-align:center}
.lbox h1{font-size:44px;font-weight:900;letter-spacing:.3em;padding-left:.3em}
.lbox p{color:var(--mute);font-size:14px}
.in{width:100%;padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:var(--paper)}
.btn{padding:13px 20px;border-radius:12px;background:var(--acc);color:var(--paper);font-weight:600}
/* library */
.wrap{max-width:1000px;margin:0 auto;padding:28px 22px 80px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:30px}
.top h2{font-size:28px;font-weight:900;letter-spacing:.2em}
.row{display:flex;gap:8px;align-items:center}
.ghost{padding:9px 14px;border-radius:10px;border:1px solid var(--line);font-size:14px}
#drop{border:1.5px dashed var(--line);border-radius:16px;padding:18px;text-align:center;color:var(--mute);font-size:14px;margin-bottom:30px;transition:.2s}
#drop.hot{border-color:var(--acc);color:var(--acc);background:var(--paper)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:28px 22px}
.card{position:relative;cursor:pointer}
.cover{aspect-ratio:3/4;border-radius:4px 10px 10px 4px;background:linear-gradient(150deg,hsl(var(--h) 32% 34%),hsl(calc(var(--h) + 35) 38% 18%));box-shadow:var(--sh),inset 6px 0 8px -4px rgba(0,0,0,.45);display:grid;place-items:center;color:rgba(255,255,255,.88);font-size:44px;font-weight:900;letter-spacing:.1em;transition:transform .25s}
.card:hover .cover{transform:translateY(-6px) rotate(-1deg)}
.card h3{font-size:14px;font-weight:600;margin:12px 0 7px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bar{height:3px;border-radius:3px;background:var(--line)}.bar b{display:block;height:100%;border-radius:3px;background:var(--acc)}
.card small{color:var(--mute);font-size:12px}
.del{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;opacity:0;transition:.2s}
.card:hover .del{opacity:1}
@media(hover:none){.del{opacity:.8}}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:60px 0}
/* reader */
#reader.on{display:flex;flex-direction:column;height:100vh;height:100dvh}
.rbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;gap:10px}
.rbar span{flex:1;text-align:center;font-size:14px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage{flex:1;min-height:0;display:flex;justify-content:center;padding:0 14px;position:relative;perspective:2000px}
#pg,.leaf{width:min(720px,100%);height:100%;background:var(--paper);border-radius:6px;box-shadow:var(--sh);padding:clamp(22px,5vw,52px);overflow:hidden;line-height:1.95;position:relative}
#pg p,.leaf p{text-indent:2em;margin-bottom:.55em;text-align:justify}
.leaf{position:absolute;pointer-events:none;transform-origin:left center;backface-visibility:hidden;z-index:3}
.leaf::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.16),transparent 45%)}
.flip{animation:fl .38s ease}
@keyframes fl{from{opacity:0;transform:translateX(calc(var(--d,1)*18px))}}
.ctl{padding:14px 18px 18px;max-width:720px;width:100%;margin:0 auto}
.prog{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--mute)}
#sl{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--acc) var(--p,0%),var(--line) var(--p,0%));outline-offset:6px}
#sl::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--acc);border:3px solid var(--paper);box-shadow:0 0 0 1px var(--acc)}
#sl::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--acc);border:3px solid var(--paper)}
.btns{display:flex;justify-content:center;align-items:center;gap:26px;margin-top:10px}
.btns button{width:44px;height:44px;border-radius:50%;font-size:18px}
#play{width:58px!important;height:58px!important;background:var(--acc);color:var(--paper);font-size:22px!important;box-shadow:0 10px 24px -10px var(--acc)}
#play.on{animation:pu 2s infinite}
@keyframes pu{50%{box-shadow:0 0 0 10px transparent,0 10px 24px -10px var(--acc)}0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--acc) 45%,transparent)}}
#set{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-radius:20px 20px 0 0;box-shadow:0 -20px 50px -20px rgba(0,0,0,.4);padding:22px 22px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .3s;max-width:720px;margin:0 auto;display:grid;gap:16px;z-index:5}
#set.on{transform:none}
#set label{display:flex;align-items:center;justify-content:space-between;gap:14px;font-size:14px}
#set select{max-width:60%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
.seg{display:flex;gap:6px}.seg button{padding:7px 12px;border:1px solid var(--line);border-radius:8px}
.seg button.on{background:var(--acc);color:var(--paper);border-color:var(--acc)}
#st{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:20px;font-size:13px;display:none;z-index:9}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<section id="lib" class="view"><div class="wrap">
  <div class="top"><h2>青卷</h2><button class="ghost" id="rf">刷新书架</button></div>
  <div id="grid"></div>
</div></section>

<section id="reader" class="view">
  <div class="rbar"><button class="ghost" id="back">‹ 书架</button><span id="rt"></span><button class="ghost" id="cfg">设置</button></div>
  <div class="stage"><div id="pg"></div></div>
  <div class="ctl">
    <div class="prog"><span id="cur">1</span><input type="range" id="sl" min="0" max="0" value="0" aria-label="阅读进度"><span id="pct">0%</span></div>
    <div class="btns"><button id="prev" aria-label="上一页">‹</button><button id="play" aria-label="朗读">▶</button><button id="next" aria-label="下一页">›</button></div>
  </div>
  <div id="set">
    <label>主题<span class="seg" id="th"><button data-v="day">青瓷</button><button data-v="xuan">宣纸</button><button data-v="night">夜</button></span></label>
    <label>字号<span class="seg"><button id="fm">A−</button><button id="fp">A＋</button></span></label>
    <label>语速<select id="rate"><option value=".8">0.8×</option><option value="1">1.0×</option><option value="1.2">1.2×</option><option value="1.5">1.5×</option><option value="1.8">1.8×</option></select></label>
    <label id="vrow">声音<span class="seg" id="voice"></span></label>
    <button class="btn" id="cl">完成</button>
  </div>
</section>
<div id="st"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
/* ===== 只需改这三行（Supabase → Project Settings → API；BUCKET 是你建的公开存储桶名）===== */
const SB_URL='https://shhrywbzwhogtyqnohxa.supabase.co', SB_KEY='sb_publishable_b4LQUkhfh6Yj43cu4HDdCA_-kNFjv4c', BUCKET='books';
/* ============================================================= */
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={t:matchMedia('(prefers-color-scheme:dark)').matches?'night':'day',fs:19,rate:1,voice:''};
try{Object.assign(S,JSON.parse(localStorage.getItem('qj')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('qj',JSON.stringify(S))}catch(e){}};
let user,books=[],B,text='',pages=[],offs=[],idx=0,tts=false,tok=0,voices=[],timer;

function show(v){document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==v))}
function toast(m,ms=0){const e=$('#st');e.textContent=m;e.style.display=m?'block':'none';if(ms)setTimeout(()=>e.style.display='none',ms)}
function applyS(){document.documentElement.dataset.t=S.t;document.querySelectorAll('#th button').forEach(b=>b.classList.toggle('on',b.dataset.v==S.t));$('#rate').value=S.rate;$('#pg').style.fontSize=S.fs+'px'}

/* ---------- library ---------- */
const OK=/\.(txt|md|epub|pdf)$/i,pub=n=>`${SB_URL}/storage/v1/object/public/${BUCKET}/${n.split('/').map(encodeURIComponent).join('/')}`;
const getP=n=>{try{return JSON.parse(localStorage.getItem('p:'+n))||[0,0]}catch(e){return[0,0]}};
async function loadBooks(){
  $('#grid').innerHTML='<p class="empty">加载书架…</p>';
  try{
    const hd={'Content-Type':'application/json',apikey:SB_KEY};if(!SB_KEY.startsWith('sb_'))hd.Authorization='Bearer '+SB_KEY;
    const r=await fetch(`${SB_URL}/rest/v1/books?select=id,title,path&order=created_at.asc`,{headers:hd});
    const d=await r.json();if(!r.ok)throw new Error(d.message||r.status);
    books=d.filter(f=>f.path).map(f=>({name:f.path,title:f.title||f.path.replace(/\.[^.]+$/,'')}));
    renderLib()
  }catch(e){$('#grid').innerHTML='<p class="empty">读取书架失败：'+esc(String(e.message||e))+'</p>'}}
function renderLib(){
  $('#grid').innerHTML=books.length?books.map((b,i)=>{
    const p=getP(b.name)[1],h=[...b.title].reduce((a,c)=>a+c.charCodeAt(0),0)%360;
    return `<div class="card" data-id="${i}"><div class="cover" style="--h:${h}">${esc([...b.title].slice(0,2).join(''))}</div><h3>${esc(b.title)}</h3><div class="bar"><b style="width:${p}%"></b></div><small>${p}%</small></div>`}).join('')
    :'<p class="empty">书架还是空的，请在 Supabase 的 books 表里添加书目</p>'}
$('#grid').onclick=e=>{const c=e.target.closest('.card');if(c)openBook(+c.dataset.id)};
$('#rf').onclick=loadBooks;

/* ---------- upload / parse ---------- */
async function extract(f){
  const ext=f.name.split('.').pop().toLowerCase(),title=f.name.replace(/\.[^.]+$/,'');
  if(ext=='epub')return epub(f,title);
  if(ext=='pdf')return pdf(f,title);
  const buf=await f.arrayBuffer();let t=new TextDecoder('utf-8').decode(buf);
  if((t.match(/\uFFFD/g)||[]).length>5)t=new TextDecoder('gbk').decode(buf);
  return{title,text:t.replace(/\r\n?/g,'\n')}}
async function epub(f,title){
  const z=await JSZip.loadAsync(f),P=new DOMParser(),rd=async p=>P.parseFromString(await z.file(p).async('string'),'text/xml');
  const root=(await rd('META-INF/container.xml')).querySelector('rootfile').getAttribute('full-path');
  const opf=await rd(root),dir=root.replace(/[^/]+$/,'');
  const t=opf.getElementsByTagName('dc:title')[0];if(t&&t.textContent.trim())title=t.textContent.trim();
  const man={};opf.querySelectorAll('manifest > item').forEach(i=>man[i.getAttribute('id')]=i.getAttribute('href'));
  const out=[];
  for(const r of opf.querySelectorAll('spine > itemref')){
    const href=man[r.getAttribute('idref')];if(!href)continue;
    const fl=z.file(decodeURIComponent(dir+href))||z.file(dir+href);if(!fl)continue;
    const d=P.parseFromString(await fl.async('string'),'text/html');
    d.querySelectorAll('script,style,rt').forEach(e=>e.remove());
    d.body.querySelectorAll('p,h1,h2,h3,h4,h5,h6,li,br,div').forEach(e=>e.after('\n'));
    const s=d.body.textContent.replace(/[ \t\u3000]+\n/g,'\n').replace(/\n\s*\n+/g,'\n').trim();
    if(s)out.push(s)}
  return{title,text:out.join('\n\n')}}
async function pdf(f,title){
  const d=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise,o=[];
  for(let i=1;i<=d.numPages;i++){
    const c=await(await d.getPage(i)).getTextContent();
    o.push(c.items.map(x=>x.str).join(' ').replace(/\s+/g,' ').replace(/([\u4e00-\u9fff，。！？、；：”“]) (?=[\u4e00-\u9fff，。！？、；：”“])/g,'$1'))}
  return{title,text:o.join('\n')}}

/* ---------- reader ---------- */
async function openBook(i){
  B=books[i];show('reader');$('#rt').textContent=B.title;$('#pg').textContent='载入中…（大文件稍等）';applyS();
  try{
    const r=await fetch(pub(B.name));if(!r.ok)throw new Error('HTTP '+r.status+'，请确认存储桶是公开的');
    const o=await extract(new File([await r.blob()],B.name));text=o.text;
    if(!text.trim())throw new Error('没有提取到文字（可能是扫描版 PDF）');
    B.pos=getP(B.name)[0];paginate();go(pageAt(B.pos),false)
  }catch(e){alert('打开失败：'+(e.message||e));show('lib')}}
function paginate(){
  const el=$('#pg'),cs=getComputedStyle(el),fs=S.fs;
  const w=el.clientWidth-parseFloat(cs.paddingLeft)*2,h=el.clientHeight-parseFloat(cs.paddingTop)*2;
  const cjk=(text.slice(0,600).match(/[\u4e00-\u9fff]/g)||[]).length>150;
  const n=Math.max(120,Math.floor(Math.floor(w/(fs*(cjk?1:.55)))*Math.floor(h/(fs*1.95))*.82));
  pages=[];offs=[];let i=0;
  while(i<text.length){
    let e=Math.min(i+n,text.length);
    if(e<text.length){const m=text.slice(e,e+60).search(/[。！？.!?\n]/);if(m>=0)e+=m+1}
    const s=text.slice(i,e);if(s.trim()){pages.push(s.trim());offs.push(i)}i=e}
  $('#sl').max=Math.max(0,pages.length-1)}
const pageAt=pos=>{let r=0;offs.forEach((o,i)=>{if(o<=pos)r=i});return r};
function go(i,anim=true,dir=1){
  idx=Math.max(0,Math.min(pages.length-1,i));
  const el=$('#pg');
  const html=pages[idx].split('\n').filter(s=>s.trim()).map(s=>`<p>${esc(s)}</p>`).join('');
  if(anim&&el.innerHTML&&!matchMedia('(prefers-reduced-motion:reduce)').matches)flip(el,el.innerHTML,html,dir);else el.innerHTML=html;
  const pc=pages.length>1?idx/(pages.length-1)*100:100;
  $('#sl').value=idx;$('#sl').style.setProperty('--p',pc+'%');
  $('#cur').textContent=`${idx+1}/${pages.length}`;$('#pct').textContent=Math.round(offs[idx]/text.length*100)+'%';
  B.pos=offs[idx];clearTimeout(timer);
  timer=setTimeout(()=>{try{localStorage.setItem('p:'+B.name,JSON.stringify([B.pos,Math.round(B.pos/text.length*100)]))}catch(e){}},500)}
function flip(el,old,html,dir){
  document.querySelectorAll('.leaf').forEach(e=>e.remove());
  const lf=el.cloneNode(false);lf.removeAttribute('id');lf.className='leaf';
  lf.style.cssText+=`;left:${el.offsetLeft}px;top:${el.offsetTop}px;width:${el.offsetWidth}px;height:${el.offsetHeight}px`;
  lf.innerHTML=dir>0?old:html;
  if(dir>0)el.innerHTML=html;
  el.parentNode.appendChild(lf);
  const a=lf.animate(dir>0?[{transform:'rotateY(0)'},{transform:'rotateY(-100deg)'}]:[{transform:'rotateY(-100deg)'},{transform:'rotateY(0)'}],{duration:650,easing:'cubic-bezier(.45,.05,.25,1)',fill:'both'});
  a.onfinish=()=>{if(dir<0)el.innerHTML=html;lf.remove()}}
function turn(d){go(idx+d,true,d);if(tts)speak()}
$('#next').onclick=()=>turn(1);$('#prev').onclick=()=>turn(-1);
$('#sl').oninput=e=>{go(+e.target.value,false)};
$('#sl').onchange=()=>{if(tts)speak()};
$('#pg').onclick=e=>{const r=e.currentTarget.getBoundingClientRect(),x=(e.clientX-r.left)/r.width;if(x<.33)turn(-1);else if(x>.67)turn(1)};
let tx=0;
$('#pg').addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
$('#pg').addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>60)turn(d<0?1:-1)});
document.addEventListener('keydown',e=>{if(!$('#reader').classList.contains('on'))return;
  if(e.key=='ArrowRight')turn(1);else if(e.key=='ArrowLeft')turn(-1);else if(e.key==' '&&e.target.tagName!='BUTTON'){e.preventDefault();toggle()}});
$('#back').onclick=()=>{stop();show('lib');renderLib()};
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if($('#reader').classList.contains('on')&&text){const p=offs[idx];paginate();go(pageAt(p),false)}},250)});

/* ---------- settings ---------- */
$('#cfg').onclick=()=>$('#set').classList.add('on');$('#cl').onclick=()=>$('#set').classList.remove('on');
$('#th').onclick=e=>{if(e.target.dataset.v){S.t=e.target.dataset.v;save();applyS()}};
const fz=d=>{S.fs=Math.max(14,Math.min(30,S.fs+d));save();applyS();const p=offs[idx];paginate();go(pageAt(p),false)};
$('#fm').onclick=()=>fz(-1);$('#fp').onclick=()=>fz(1);
$('#rate').onchange=e=>{S.rate=+e.target.value;save();if(tts)speak()};
$('#voice').onclick=e=>{const v=e.target.dataset.v;if(v){S.voice=v;save();loadVoices();if(tts)speak()}};

/* ---------- 听书 ---------- */
function loadVoices(){
  const all=speechSynthesis.getVoices(),zh=all.filter(v=>/^zh/i.test(v.lang));
  const rank=v=>/Natural|Online|Xiao|Yun|Ting|Mei|Google/i.test(v.name)?0:1;
  voices=(zh.length?zh:all).sort((a,b)=>rank(a)-rank(b)).slice(0,2);
  if(!voices.find(v=>v.name==S.voice))S.voice=voices[0]?voices[0].name:'';
  $('#vrow').style.display=voices.length<2?'none':'';
  $('#voice').innerHTML=voices.map(v=>`<button data-v="${esc(v.name)}" class="${v.name==S.voice?'on':''}">${esc(v.name.replace(/^(Microsoft|Google)\s*/,'').split(/[\s-]/)[0].slice(0,12))}</button>`).join('')}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function speak(){
  if(!tts)return;speechSynthesis.cancel();speechSynthesis.resume();
  const my=++tok,ss=(pages[idx].match(/[^。！？!?.\n]+[。！？!?.”"]*/g)||[]).filter(s=>s.trim());let k=0,ok=0;
  const next=()=>{
    if(my!=tok||!tts)return;
    if(k>=ss.length){ if(idx<pages.length-1){go(idx+1,true,1);speak()}else stop();return }
    const s=ss[k++],u=new SpeechSynthesisUtterance(s);
    u.lang=/[\u4e00-\u9fff]/.test(s)?'zh-CN':'en-US';u.rate=S.rate;
    const v=voices.find(v=>v.name==S.voice);if(v&&v.lang.slice(0,2)==u.lang.slice(0,2))u.voice=v;
    u.onstart=()=>{ok=1};u.onend=next;u.onerror=e=>{if(e.error=='canceled'||e.error=='interrupted')return;toast('朗读出错：'+e.error,5000);stop()};
    speechSynthesis.speak(u)};
  setTimeout(next,120);setTimeout(()=>{if(my==tok&&tts&&!ok)toast('没有声音？请检查音量，或系统里是否装了中文语音',6000)},3500)}
function stop(){tts=false;tok++;if('speechSynthesis' in window)speechSynthesis.cancel();$('#play').textContent='▶';$('#play').classList.remove('on')}
function toggle(){
  if(!('speechSynthesis' in window))return alert('此浏览器不支持朗读');
  if(tts){stop();return}
  if(!speechSynthesis.getVoices().length)toast('提示：没有检测到朗读声音，可能无法发声',4000);
  tts=true;$('#play').textContent='❚❚';$('#play').classList.add('on');speak()}
$('#play').onclick=toggle;
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&tts)speak()});
applyS();show('lib');loadBooks();
</script>
</body>
</html>
