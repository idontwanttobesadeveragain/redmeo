<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>私人阅读空间</title>
    <!-- 引入 Supabase 官方 SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #212529;
            --accent-color: #4a6fa5;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            max-width: 720px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        h1 {
            font-size: 1.8rem;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 12px;
            margin-bottom: 24px;
        }
        .book-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .book-card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .book-info h3 {
            margin: 0 0 6px 0;
            font-size: 1.2rem;
        }
        .book-info p {
            margin: 0;
            color: #6c757d;
            font-size: 0.9rem;
        }
        .btn-read {
            display: inline-block;
            background-color: var(--accent-color);
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
            transition: opacity 0.2s;
        }
        .btn-read:hover {
            opacity: 0.9;
        }
        .status-msg {
            text-align: center;
            color: #6c757d;
            padding: 40px 0;
        }
    </style>
</head>
<body>

    <h1>📚 我的私人书库</h1>
    <div id="book-list" class="book-list">
        <div class="status-msg">正在连接云端数据库...</div>
    </div>

    <script>
        // ==========================================
        // 请在此处替换为 Supabase 项目的 API 信息
        // ==========================================
        const SUPABASE_URL = 'https://shhrywbzwhogtyqnohxa.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_b4LQUkhfh6Yj43cu4HDdCA_-kNFjv4c';
        
        // 初始化 Supabase
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function fetchBooks() {
            const container = document.getElementById('book-list');
            try {
                const { data, error } = await _supabase.from('books').select('*').order('created_at', { ascending: false });
                
                if (error) throw error;

                if (!data || data.length === 0) {
                    container.innerHTML = '<div class="status-msg">书库暂无内容，请在 Supabase 后台添加书籍。</div>';
                    return;
                }

                container.innerHTML = data.map(book => `
                    <div class="book-card">
                        <div class="book-info">
                            <h3>${book.title}</h3>
                            <p>作者：${book.author || '未署名'}</p>
                        </div>
                        <a href="${book.file_url}" class="btn-read" target="_blank">阅读文件</a>
                    </div>
                `).join('');
            } catch (err) {
                container.innerHTML = `<div class="status-msg" style="color: red;">加载失败：${err.message}</div>`;
            }
        }

        fetchBooks();
    </script>
</body>
</html>
